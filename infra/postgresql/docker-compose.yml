services:
  postgres:
    image: postgres:15
    container_name: postgres_15
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: gateway-api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    networks:
      - database

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    restart: always
    ports:
      - '6432:5432'
    depends_on:
      - postgres
    networks:
      - database
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_NAME: gateway-api
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: root
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.25

networks:
  database:
    driver: bridge

volumes:
  postgres_data:
    driver: local
