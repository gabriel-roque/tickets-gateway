services:
  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    restart: always
    ports:
      - 9200:9200
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      - xpack.monitoring.templates.enabled=true
      - xpack.watcher.enabled=false
      - 'ES_JAVA_OPTS=-Xms384m -Xmx384m'
      - discovery.type=single-node
      - ELASTICSEARCH_USERNAME="elastic"
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD}
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.50
    networks:
      - elastic

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.10.1
    restart: always
    ports:
      - 5601:5601
    volumes:
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml
    depends_on:
      - elasticsearch
    environment:
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_SAVED_OBJECTS_KEY:?Set KIBANA_SAVED_OBJECTS_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY:?Set KIBANA_REPORTING_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_KEY:?Set KIBANA_SECURITY_KEY}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_HOSTS=["http://elasticsearch:9200"]
      - ELASTICSEARCH_USERNAME="kibana_system"
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?Set KIBANA_PASSWORD}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.35
    networks:
      - elastic

  apm-server:
    container_name: apm-server
    image: docker.elastic.co/apm/apm-server:8.10.1
    restart: always
    volumes:
      - ./config/apm-server.yml:/usr/share/apm-server/apm-server.yml
    environment:
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD:?Set ELASTICSEARCH_PASSWORD}
    ports:
      - 8200:8200
    depends_on:
      - elasticsearch
      - kibana
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
    networks:
      - elastic

networks:
  elastic:
    driver: bridge

volumes:
  elasticsearch-data:
