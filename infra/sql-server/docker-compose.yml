services:
  sqldata:
    image: mcr.microsoft.com/mssql/server:2019-CU28-ubuntu-20.04
    container_name: sql_server_2019
    restart: unless-stopped
    environment:
      - SA_PASSWORD=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}
      - ACCEPT_EULA=Y
      - MSSQL_MEMORY_LIMIT_MB=1536
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: 1.00

volumes:
  sqlserver-data:
    driver: local
