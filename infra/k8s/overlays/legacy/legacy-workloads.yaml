apiVersion: v1
kind: ConfigMap
metadata: { name: legacy-postgres-init, namespace: eventsphere }
data:
  01-schema.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE TABLE IF NOT EXISTS transaction_pix (
      id uuid DEFAULT uuid_generate_v4() PRIMARY KEY,
      name varchar(100) NOT NULL,
      external_id varchar(100) NOT NULL UNIQUE,
      value integer NOT NULL,
      qr_code varchar(255) NOT NULL,
      status boolean DEFAULT false NOT NULL
    );
---
apiVersion: v1
kind: Service
metadata: { name: legacy-postgres, namespace: eventsphere }
spec:
  selector: { app: legacy-postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: legacy-postgres, namespace: eventsphere }
spec:
  serviceName: legacy-postgres
  replicas: 1
  selector: { matchLabels: { app: legacy-postgres } }
  template:
    metadata: { labels: { app: legacy-postgres, tier: legacy } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: root }
            - { name: POSTGRES_DB, value: gateway-api }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: DbPassword } }
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { tcpSocket: { port: 5432 }, initialDelaySeconds: 5, periodSeconds: 5 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: init
          configMap: { name: legacy-postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: legacy-gateway-api, namespace: eventsphere }
spec:
  selector: { app: legacy-gateway-api }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: legacy-gateway-api, namespace: eventsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: legacy-gateway-api } }
  template:
    metadata: { labels: { app: legacy-gateway-api, tier: legacy } }
    spec:
      containers:
        - name: gateway-api
          image: gateway-api:legacy
          imagePullPolicy: IfNotPresent
          env:
            - { name: DB_HOST, value: legacy-postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_USER, value: root }
            - { name: DB_NAME, value: gateway-api }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: DbPassword } }
            - name: X_API_KEY
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Security__ApiKey } }
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 250m, memory: 192Mi }
          readinessProbe: { httpGet: { path: /healthy, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: legacy-tickets-api, namespace: eventsphere }
spec:
  selector: { app: legacy-tickets-api }
  ports: [{ name: http, port: 5000, targetPort: 5000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: legacy-tickets-api, namespace: eventsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: legacy-tickets-api } }
  template:
    metadata: { labels: { app: legacy-tickets-api, tier: legacy } }
    spec:
      initContainers:
        - name: migrate
          image: tickets-api:legacy
          imagePullPolicy: IfNotPresent
          env: &ticketsEnv
            - { name: Legacy__MigrateOnly, value: "true" }
            - name: ConnectionStrings__TicketDB
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Legacy__TicketDb } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Security__JwtSigningKey } }
            - { name: Jwt__Issuer, value: https://tickets-api }
            - { name: Jwt__Audience, value: https://tickets-api }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 350m, memory: 320Mi }
      containers:
        - name: tickets-api
          image: tickets-api:legacy
          imagePullPolicy: IfNotPresent
          env:
            - name: ConnectionStrings__TicketDB
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Legacy__TicketDb } }
            - { name: Kafka__Url, value: kafka:9092 }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Security__JwtSigningKey } }
            - { name: Jwt__Issuer, value: https://tickets-api }
            - { name: Jwt__Audience, value: https://tickets-api }
            - { name: GatewayApi__Url, value: http://legacy-gateway-api:3000 }
            - name: GatewayApi__XApiKey
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: Security__ApiKey } }
            - { name: ElasticApm__Enabled, value: "false" }
          ports: [{ containerPort: 5000 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 350m, memory: 320Mi }
          readinessProbe: { tcpSocket: { port: 5000 }, initialDelaySeconds: 10, periodSeconds: 5 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: eventsphere-router, namespace: eventsphere }
data:
  nginx.conf: |
    events { worker_connections 2048; }
    http {
      server {
        listen 8080;
        location /api/v2/ {
          error_page 418 = @query_api;
          if ($request_method ~ ^(GET|HEAD)$) { return 418; }
          proxy_pass http://command-api;
        }
        location @query_api { proxy_pass http://query-api; }
        location /health/ { proxy_pass http://command-api; }
        location /events { proxy_pass http://legacy-tickets-api:5000; }
        location /tickets { proxy_pass http://legacy-tickets-api:5000; }
        location /legacy/gateway/ {
          rewrite ^/legacy/gateway/(.*)$ /$1 break;
          proxy_pass http://legacy-gateway-api:3000;
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata: { name: eventsphere-router, namespace: eventsphere }
spec:
  selector: { app: eventsphere-router }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: eventsphere-router, namespace: eventsphere }
spec:
  replicas: 1
  selector: { matchLabels: { app: eventsphere-router } }
  template:
    metadata: { labels: { app: eventsphere-router, tier: legacy } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.3-alpine
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 2, periodSeconds: 5 }
          volumeMounts: [{ name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }]
      volumes:
        - name: config
          configMap: { name: eventsphere-router }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: legacy-strangler, namespace: eventsphere }
spec:
  podSelector: { matchLabels: { tier: legacy } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: {} }]
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 5000 }
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 5432 }
  egress:
    - to: [{ namespaceSelector: {} }]
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 1433 }
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 5000 }
        - { protocol: TCP, port: 5432 }
    - to: [{ namespaceSelector: {} }]
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-legacy-to-core, namespace: eventsphere }
spec:
  podSelector: { matchLabels: { app: eventsphere } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { tier: legacy } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-legacy-to-sql-kafka, namespace: eventsphere }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [sqlserver, kafka] }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { tier: legacy } } }]
      ports:
        - { protocol: TCP, port: 1433 }
        - { protocol: TCP, port: 9092 }
