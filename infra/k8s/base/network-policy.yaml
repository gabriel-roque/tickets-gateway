apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: eventsphere
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eventsphere-application
  namespace: eventsphere
spec:
  podSelector: { matchLabels: { app: eventsphere } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 1433 }
        - { protocol: TCP, port: 9092 }
        - { protocol: TCP, port: 4317 }
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sqlserver
  namespace: eventsphere
spec:
  podSelector: { matchLabels: { app: sqlserver } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: eventsphere } }
      ports: [{ protocol: TCP, port: 1433 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
  namespace: eventsphere
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: eventsphere } }
      ports: [{ protocol: TCP, port: 9092 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k6-runners
  namespace: eventsphere
spec:
  podSelector: { matchLabels: { runner: "true" } }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: eventsphere, role: command } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - podSelector: { matchLabels: { app: eventsphere, role: query } }
      ports: [{ protocol: TCP, port: 8080 }]
    - to:
        - namespaceSelector: {}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: eventsphere
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: eventsphere } }
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 8889 }]
