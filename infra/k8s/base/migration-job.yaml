apiVersion: batch/v1
kind: Job
metadata:
  name: eventsphere-migration
  namespace: eventsphere
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: eventsphere, role: migration }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: eventsphere
      containers:
        - name: migration
          image: eventsphere-api:1.0.0
          envFrom:
            - configMapRef: { name: eventsphere-config }
            - secretRef: { name: eventsphere-secrets }
          env:
            - { name: EventSphere__Role, value: migration }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
