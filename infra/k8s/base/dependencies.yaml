apiVersion: v1
kind: Service
metadata: { name: sqlserver, namespace: eventsphere }
spec:
  selector: { app: sqlserver }
  ports: [{ name: sql, port: 1433, targetPort: 1433 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: sqlserver, namespace: eventsphere }
spec:
  serviceName: sqlserver
  replicas: 1
  selector: { matchLabels: { app: sqlserver } }
  template:
    metadata: { labels: { app: sqlserver } }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
          ports: [{ containerPort: 1433 }]
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_MEMORY_LIMIT_MB, value: "3072" }
            - name: MSSQL_SA_PASSWORD
              valueFrom: { secretKeyRef: { name: eventsphere-secrets, key: DbPassword } }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "4", memory: 4Gi }
          volumeMounts: [{ name: data, mountPath: /var/opt/mssql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: eventsphere }
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: kafka, namespace: eventsphere }
spec:
  serviceName: kafka
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      containers:
        - name: kafka
          image: redpandadata/redpanda:v24.3.6
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=4
            - --memory=4G
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=kafka.eventsphere.svc.cluster.local:9092
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { cpu: "4", memory: 5Gi }
          volumeMounts: [{ name: data, mountPath: /var/lib/redpanda/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
