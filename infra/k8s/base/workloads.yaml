apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-api
  namespace: eventsphere
spec:
  replicas: 3
  selector:
    matchLabels: { app: eventsphere, role: command }
  template:
    metadata:
      labels: { app: eventsphere, role: command }
    spec:
      serviceAccountName: eventsphere
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: eventsphere, role: command }
      containers:
        - name: eventsphere
          image: eventsphere-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: eventsphere-config }
            - secretRef: { name: eventsphere-secrets }
          env:
            - { name: EventSphere__Role, value: command }
          startupProbe: &startup
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe: &ready
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe: &live
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources: &apiResources
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
---
