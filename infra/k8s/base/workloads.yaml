apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-worker
  namespace: eventsphere
spec:
  # A single ordered projector owns the global checkpoint. Horizontal scale is
  # intentionally disabled; availability comes from Deployment restart.
  replicas: 1
  selector:
    matchLabels: { app: eventsphere, role: projection }
  template:
    metadata:
      labels: { app: eventsphere, role: projection }
    spec:
      serviceAccountName: eventsphere
      containers:
        - name: eventsphere
          image: eventsphere-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: eventsphere-config }
            - secretRef: { name: eventsphere-secrets }
          env:
            - { name: EventSphere__Role, value: projection }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
