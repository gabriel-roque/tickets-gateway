apiVersion: v1
kind: ConfigMap
metadata:
  name: eventsphere-config
  namespace: eventsphere
data:
  ASPNETCORE_ENVIRONMENT: Production
  Kafka__BootstrapServers: kafka.eventsphere.svc.cluster.local:9092
  Commands__AsyncIngress: "true"
  Reservations__TtlMinutes: "5"
  SeatLocks__TtlSeconds: "120"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.eventsphere.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
