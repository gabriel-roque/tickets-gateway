apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: eventsphere
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 384 }
      batch: { timeout: 2s, send_batch_size: 1024 }
    exporters:
      debug: { verbosity: basic }
      prometheus: { endpoint: 0.0.0.0:8889 }
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: eventsphere
spec:
  replicas: 2
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.165.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: grpc, containerPort: 4317 }
            - { name: http, containerPort: 4318 }
            - { name: metrics, containerPort: 8889 }
            - { name: health, containerPort: 13133 }
          volumeMounts: [{ name: config, mountPath: /conf }]
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: eventsphere
spec:
  selector: { app: otel-collector }
  ports:
    - { name: grpc, port: 4317, targetPort: grpc }
    - { name: http, port: 4318, targetPort: http }
    - { name: metrics, port: 8889, targetPort: metrics }
