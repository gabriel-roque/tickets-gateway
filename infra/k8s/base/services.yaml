apiVersion: v1
kind: ServiceAccount
metadata:
  name: eventsphere
  namespace: eventsphere
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: command-api
  namespace: eventsphere
spec:
  selector: { app: eventsphere, role: command }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: eventsphere
spec:
  selector: { app: eventsphere, role: query }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eventsphere
  namespace: eventsphere
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "5000"
spec:
  rules:
    - host: command.eventsphere.local
      http:
        paths:
          - path: /api/v2
            pathType: Prefix
            backend: { service: { name: command-api, port: { name: http } } }
    - host: query.eventsphere.local
      http:
        paths:
          - path: /api/v2
            pathType: Prefix
            backend: { service: { name: query-api, port: { name: http } } }
